[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stdev"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSE" }

dependencies = [
    "diffusers>=0.41.0",
    "transformers",
    "numpy>=2.0",
    "opencv-python==4.12.0.88",
    "accelerate",
    "safetensors>=0.4.0",
    "ipykernel",
    "matplotlib",
    "tqdm",
    "tensorboard",
    "torchmetrics[image]",
    "omegaconf",
    "vaezip"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]